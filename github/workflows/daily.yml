name: Atualizar painel diário

on:
  schedule:
    # 11:00 UTC = 08:00 em Brasília (horário padrão, sem horário de verão)
    - cron: "0 11 * * *"
  workflow_dispatch: {}   # permite clicar em "Run workflow" e testar na hora, sem esperar o horário

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar a coleta e gerar o painel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper.py

      - name: Publicar o resultado
        run: |
          git config user.name "painel-bot"
          git config user.email "painel-bot@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Atualização automática do painel"
          git push
